stages:
  - lint
  - test
  - build
  - deploy

variables:
  DOCKER_IMAGE: eduardotartas/gerenciamento-rural-api:$CI_COMMIT_SHORT_SHA
  KUBERNETES_NAMESPACE: "pasto-livre-prod"

lint_kubernetes_yaml:
  stage: lint
  image:
    name: ghcr.io/yannh/kubeconform:latest-alpine
    entrypoint: [""]
  tags:
    - k3s-runner
  script:
    - /kubeconform -summary -verbose -strict deployment/

test_job:
  stage: test
  image: node:22-bookworm-slim
  tags:
    - k3s-runner
  services:
    - name: postgres:17-alpine
      alias: postgres
  variables:
    POSTGRES_DB: pasto_livre_teste
    POSTGRES_USER: teste
    POSTGRES_PASSWORD: teste
    DATABASE_URL_TESTE: "postgresql://teste:teste@127.0.0.1:5432/pasto_livre_teste"
    npm_config_cache: "$CI_PROJECT_DIR/.npm"
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --prefer-offline --no-audit --fund=false
    - npx prisma generate
    - >
      node -e "const net=require('node:net');const ate=Date.now()+60000;
      (function t(){const s=net.connect(5432,'127.0.0.1');
      s.on('connect',()=>{s.end();console.log('postgres pronto')});
      s.on('error',()=>{s.destroy();
      if(Date.now()>ate){console.error('postgres nao respondeu em 60s');process.exit(1)}
      setTimeout(t,1000)})})()"
  script:
    - npm test -- --reporter=default --reporter=junit --outputFile=junit.xml
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: junit.xml
  interruptible: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"

build_job:
  stage: build
  only:
    - main
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  tags:
    - k3s-runner
  script:
    - echo "{\"auths\":{\"https://index.docker.io/v1/\":{\"auth\":\"$(printf "%s:%s" "${DOCKERHUB_USER}" "${DOCKERHUB_PASS}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor --context "${CI_PROJECT_DIR}" --dockerfile "${CI_PROJECT_DIR}/Dockerfile" --destination "${DOCKER_IMAGE}"

deploy_job:
  stage: deploy
  image: bitnami/kubectl:latest
  tags:
    - k3s-runner
  script:
    - kubectl set image deployment/gerenciamento-rural-api gerenciamento-rural-api=$DOCKER_IMAGE -n $KUBERNETES_NAMESPACE
    - kubectl rollout status deployment/gerenciamento-rural-api -n $KUBERNETES_NAMESPACE
  only:
    - main
